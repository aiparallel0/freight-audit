name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (tesseract + opencv libs)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0
      - name: Install package with all extras
        run: pip install -e ".[ocr,dev,synth,textract,api,postgres]"
      - name: Run full suite (SQLite)
        run: python -m pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fa
          POSTGRES_PASSWORD: fa
          POSTGRES_DB: fa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fa:fa@localhost:5432/fa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0
      - name: Install package with all extras
        run: pip install -e ".[ocr,dev,synth,textract,api,postgres]"
      - name: Run storage tests against Postgres
        run: python -m pytest -q tests/test_storage_postgres.py
