[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freight-audit"
version = "0.1.0"
description = "Audit freight carrier invoices against rate confirmations and proofs of delivery — catch overcharges, unauthorized accessorials, and uncollected detention."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["freight", "logistics", "invoice-audit", "trucking", "document-automation", "ocr", "accessorial"]
authors = [{ name = "freight-audit contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
# OCR pipeline (also requires the system `tesseract` binary, v5+)
ocr = [
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8",
    "pillow>=9.0",
    "numpy>=1.23",
]
# Real cloud-OCR provider: AWS Textract (AnalyzeExpense + AnalyzeDocument QUERIES).
# Credentials come from the standard AWS environment, never from source.
textract = [
    "boto3>=1.26",
]
# Synthetic, PII-free freight document generation (rendering needs Pillow).
synth = [
    "pillow>=9.0",
]
# REST API (FastAPI app in freight_audit.api) + Stripe billing.
api = [
    "fastapi>=0.110",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "stripe>=7",
]
# Postgres storage backend (config-switchable via DATABASE_URL).
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.scripts]
freight-audit = "freight_audit.cli:main"
freight-audit-ocr = "freight_audit.ocr.cli:main"
freight-audit-synth = "freight_audit.synth.cli:main"
freight-audit-pipeline = "freight_audit.pipeline:main"
freight-audit-vocab = "freight_audit.vocab_cli:main"

[project.urls]
Homepage = "https://github.com/your-org/freight-audit"
Issues = "https://github.com/your-org/freight-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/freight_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
